<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ciclo de IA Empresarial</title>
<style>
/* Layout: escenario vertical con cámara que hace zoom + panel lateral que narra cada escena */
:root{
  --bg:#070d1c; --panel:#0d1730; --line:#1f3157; --ink:#e8f0ff; --mute:#9fb2d6;
  --cyan:#3ee6ff; --violet:#9b7bff; --green:#4dffb0; --amber:#ffcb57;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'Source Sans 3','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-inline:16px;padding-block:20px;margin:0}
.wrap{max-width:1180px;margin-inline:auto;display:grid;grid-template-columns:min(46vw,calc((100vh - 40px)*.7465)) minmax(0,1fr);gap:28px;align-items:start}
.view{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:6px;background:#050a16;
  aspect-ratio:1493/2000;width:100%;touch-action:pan-y}
.stage{position:absolute;left:0;top:0;width:1493px;height:2000px;transform-origin:0 0;
  transition:transform 1.7s cubic-bezier(.65,0,.25,1);will-change:transform}
.stage img{position:absolute;inset:0;width:1493px;height:2000px;display:block;max-width:none}
.stage svg{position:absolute;inset:0;width:1493px;height:2000px;overflow:visible}
.dim{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease;pointer-events:none}
[data-scene="1"] .dim.d-a,[data-scene="2"] .dim.d-b,[data-scene="3"] .dim.d-c{opacity:0}
[data-scene="1"] .dim.d-b,[data-scene="1"] .dim.d-c,
[data-scene="2"] .dim.d-a,[data-scene="2"] .dim.d-c,
[data-scene="3"] .dim.d-a,[data-scene="3"] .dim.d-b{opacity:1}

/* efectos por capa: todos visibles en la vista general, solo el activo en cada escena */
.fx{transition:opacity 1s ease}
[data-scene="1"] .fx:not(.fx-agile),[data-scene="2"] .fx:not(.fx-crisp),[data-scene="3"] .fx:not(.fx-valor){opacity:.15}
[data-scene="4"] .fx:not(.fx-loop){opacity:.45}
.fx-loop{opacity:0}
[data-scene="4"] .fx-loop{opacity:1}

.spin{transform-box:fill-box;transform-origin:center;animation:spin 5s linear infinite}
.spin.rev{animation-direction:reverse;animation-duration:7s}
@keyframes spin{to{transform:rotate(360deg)}}
.breathe{transform-box:fill-box;transform-origin:center;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.92);opacity:.55}50%{transform:scale(1.12);opacity:1}}
.flow{animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-48}}
.node .halo{transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite;opacity:.5}
.node .ping{transform-box:fill-box;transform-origin:center;opacity:0}
.node.on .ping{animation:ping 1.3s ease-out infinite}
.node .halo{fill:url(#gCyan)}
.node.on .halo{fill:url(#gAmber);animation:breathe 1.2s ease-in-out infinite;opacity:1}
@keyframes ping{0%{transform:scale(.5);opacity:.95}100%{transform:scale(2.1);opacity:0}}
.scan{animation:scan 3.6s ease-in-out infinite}
@keyframes scan{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(330px);opacity:0}}
.scan2{animation:scan2 3.6s ease-in-out infinite;animation-delay:.8s}
@keyframes scan2{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(240px);opacity:0}}
.flash{animation:flash 2.4s ease-in-out infinite}
@keyframes flash{0%,100%{opacity:.05}50%{opacity:.5}}
.paused *{animation-play-state:paused !important}

/* panel */
.panel{display:flex;flex-direction:column;gap:20px;min-width:0;padding-top:4px}
.eyebrow{font:600 13px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
h1{font:700 clamp(32px,3.8vw,46px)/.98 var(--f-display);text-transform:uppercase;letter-spacing:.01em;margin:10px 0 0;text-wrap:balance}
.scene-title{font:700 28px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;margin:0;color:var(--ink)}
.scene-text{margin:0;color:var(--mute);max-width:56ch;min-height:6.2em}
.card{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.steps li{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border:1px solid var(--line);border-radius:4px;color:var(--mute);
  font-size:14px;line-height:1.3;transition:all .4s}
.steps li b{font:700 13px var(--f-body);font-variant-numeric:tabular-nums;color:var(--mute)}
.steps li.on{border-color:var(--amber);color:var(--ink);background:#1a2140}
.steps li.on b{color:var(--amber)}
.steps-note{margin:0;font-size:14px;color:var(--mute);min-height:2.8em}
.nav{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1px solid var(--line);background:transparent;color:var(--mute);font:600 14px var(--f-body);
  padding:9px 14px;border-radius:4px;cursor:pointer;min-height:40px}
.chip:hover{border-color:var(--cyan);color:var(--ink)}
.chip[aria-current="true"]{background:var(--cyan);border-color:var(--cyan);color:#04101f}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 14px var(--f-body);
  padding:10px 16px;border-radius:4px;cursor:pointer;min-height:42px}
.btn:hover{border-color:var(--cyan)}
.btn.main{background:var(--violet);border-color:var(--violet);color:#0a0820}
.chip:focus-visible,.btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--violet))}
@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:20px}
  .view{width:100%}
  .steps{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){.stage{transition-duration:.01s}}
</style>

  var tk=el('g',{},gA);
  var tkr=el('rect',{x:-34,y:-16,width:68,height:32,rx:5,fill:'#ffcb57',opacity:.95,transform:'skewY(-18)'},tk);
  el('rect',{x:-24,y:-6,width:40,height:5,rx:2,fill:'#5a3a00',opacity:.55,transform:'skewY(-18)'},tk);
  var amT=el('animateMotion',{dur:'6s',repeatCount:'indefinite'},tk);
  var mpT=el('mpath',{},amT);mpT.setAttribute('href','#pTicket');
  el('animate',{attributeName:'opacity',values:'0;1;1;1;0',dur:'6s',repeatCount:'indefinite'},tk);
  // reunión diaria
  el('rect',{x:1075,y:350,width:250,height:200,rx:10,fill:'none',stroke:'#3ee6ff','stroke-width':3,'class':'flash',transform:'skewY(4) translate(0,-78)'},gA);
  var sc=el('g',{transform:'translate(1085,380)'},gA);
  el('rect',{x:0,y:0,width:20,height:140,fill:'url(#gScan)','class':'scan2',opacity:.9},sc);
  // flechas verticales izquierda (hacia la fase ágil)
  dash(gA,'M 175 840 L 175 705','#3ee6ff',3);
  dash(gA,'M 232 800 L 232 740','#3ee6ff',3);
  dot(gA,'M 175 850 L 175 700',2.2,3,'gCyan',9);
  dot(gA,'M 232 810 L 232 735',1.6,3,'gCyan',8);

  /* ---------- capa CRISP-DM ---------- */
  var gC=document.getElementById('gCrisp');
  dotRef(gC,'pRing',9,7,'gCyan',13);
  dotRef(gC,'pRing',9,4,'gViolet',9);
  var nodes=[[505,950],[975,945],[1100,1105],[750,1328],[482,1255],[375,1075]];
  var nodeEls=nodes.map(function(p){
    var g=el('g',{'class':'node',transform:'translate('+p[0]+','+p[1]+')'},gC);
    el('circle',{r:78,'class':'halo'},g);
    el('circle',{r:46,fill:'none',stroke:'#ffcb57','stroke-width':4,'class':'ping'},g);
    return g;
  });
  // centro del ciclo
  el('ellipse',{cx:750,cy:1125,rx:150,ry:60,fill:'url(#gCyan)',opacity:.22,'class':'breathe'},gC);
  // flecha de despliegue (hacia la capa inferior)
  dash(gC,'M 1290 1260 L 1290 1445','#9b7bff',4);
  dot(gC,'M 1290 1255 L 1290 1450',2.2,3,'gViolet',11);
  dash(gC,'M 192 1280 L 192 1370','#9b7bff',3,.6);

  /* ---------- capa Valor ---------- */
  var gV=document.getElementById('gValor');
  var brain=[770,1590];
  var lines=[
    'M 770 1590 Q 640 1480 520 1470',   // nube
    'M 770 1590 Q 900 1480 1020 1500',  // servidores
    'M 770 1590 Q 1000 1500 1190 1580', // monitor
    'M 770 1590 Q 520 1590 330 1660',   // laptop izq
    'M 770 1590 Q 640 1700 570 1760',   // laptop centro
    'M 770 1590 Q 900 1690 990 1720'    // laptop der
  ];
  el('circle',{cx:brain[0],cy:brain[1],r:150,fill:'url(#gCyan)',opacity:.35,'class':'breathe'},gV);
  el('circle',{cx:brain[0],cy:brain[1],r:105,fill:'none',stroke:'#3ee6ff','stroke-width':2,'stroke-dasharray':'8 18','stroke-linecap':'round',opacity:.8,'class':'spin'},gV);
  lines.forEach(function(d,i){dash(gV,d,i%2?'#9b7bff':'#3ee6ff',3,.85);dot(gV,d,2.6+i*.25,2,i%2?'gViolet':'gCyan',9)});
  var mon=el('g',{transform:'translate(1130,1440)'},gV);
  el('rect',{x:0,y:0,width:16,height:150,fill:'url(#gScan)','class':'scan2',opacity:.85},mon);
  // análisis predictivos: barrido sobre la gráfica de la derecha
  var ch=el('g',{transform:'translate(1030,760)'},gV);
  el('rect',{x:0,y:0,width:26,height:160,fill:'url(#gScan)','class':'scan'},ch);

  /* ---------- capa feedback ---------- */
  var gL=document.getElementById('gLoop');
  el('use',{href:'#pLoop'},gL);
  var lp=gL.lastChild;lp.setAttribute('fill','none');lp.setAttribute('stroke','#4dffb0');lp.setAttribute('stroke-width',4);lp.setAttribute('stroke-dasharray','3 21');lp.setAttribute('stroke-linecap','round');lp.setAttribute('class','flow');
  dotRef(gL,'pLoop',5,3,'gGreen',16);
  [[285,1840],[760,1850],[1215,1850]].forEach(function(p){
    el('circle',{cx:p[0],cy:p[1],r:80,fill:'none',stroke:'#4dffb0','stroke-width':3,'stroke-dasharray':'30 30','stroke-linecap':'round','class':'spin',opacity:.9},gL);
    el('circle',{cx:p[0],cy:p[1],r:90,fill:'url(#gGreen)',opacity:.25,'class':'breathe'},gL);
  });
  var bg=el('ellipse',{cx:400,cy:560,rx:150,ry:130,fill:'url(#gAmber)',opacity:0},gL);
  el('animate',{attributeName:'opacity',values:'0;0;.6;0',dur:'5s',repeatCount:'indefinite'},bg);

  /* ---------- sombreado por capas ---------- */
  function band(id,y1,y2,f){
    var d=document.getElementById(id);
    d.style.background='linear-gradient(to bottom,rgba(3,7,18,.7) 0,rgba(3,7,18,.7) '+y1+'px,rgba(3,7,18,0) '+(y1+f)+'px,rgba(3,7,18,0) '+(y2-f)+'px,rgba(3,7,18,.7) '+y2+'px,rgba(3,7,18,.7) 100%)';
  }
  // d-a se muestra cuando NO está activa la capa A, etc.: cada banda oscurece su propia capa
  function dimLayer(id,y1,y2,f){
    var d=document.getElementById(id);
    d.style.background='linear-gradient(to bottom,rgba(3,7,18,0) '+(y1-f)+'px,rgba(3,7,18,.72) '+(y1+f)+'px,rgba(3,7,18,.72) '+(y2-f)+'px,rgba(3,7,18,0) '+(y2+f)+'px)';
  }
  dimLayer('dimA',-60,1040,70);
  dimLayer('dimB',900,1500,70);
  dimLayer('dimC',1440,2080,70);

  /* ---------- guion ---------- */
  var CRISP=[
    ['Comprensión del negocio','Definir el objetivo y cómo se medirá el éxito.'],
    ['Comprensión de los datos','Explorar fuentes, calidad y cobertura de los datos.'],
    ['Preparación de los datos','Limpiar, transformar y construir las variables.'],
    ['Modelado','Entrenar y comparar modelos candidatos.'],
    ['Evaluación','Medir el resultado frente al objetivo de negocio.'],
    ['Despliegue','Entregar el modelo a producción.']
  ];
  var SCENES=[
    {name:'Visión general',focus:[746,1000],z:1,dur:6500,title:'Tres capas conectadas',
     text:'La gestión ágil define qué construir, CRISP-DM guía cómo construirlo y el despliegue convierte el modelo en valor medible.'},
    {name:'Fase ágil',focus:[746,560],z:1.3,dur:9000,title:'Fase ágil y negocio',
     text:'El backlog de IA reúne las ideas priorizadas. Los sprints rápidos las llevan a entrega, el Scrum Master protege el ritmo, la reunión diaria destraba bloqueos y la retrospectiva deja aprendizajes para el siguiente sprint.'},
    {name:'CRISP-DM',focus:[746,1130],z:1.3,dur:13800,title:'Ciclo CRISP-DM en IA',steps:true,
     text:'Cada historia del backlog recorre el ciclo. Es iterativo: lo que se aprende al evaluar vuelve a la comprensión del negocio y de los datos.'},
    {name:'Implementación y valor',focus:[746,1640],z:1.3,dur:9000,title:'Implementación y valor de IA',
     text:'El modelo llega a producción en la nube y en los equipos de trabajo. El monitoreo y los análisis predictivos en tiempo real muestran si entrega el valor esperado.'},
    {name:'Feedback',focus:[746,1000],z:1,dur:8000,title:'Feedback y mejora continua',
     text:'El uso real genera feedback. Ese aprendizaje regresa al backlog de IA y el ciclo vuelve a empezar con mejores prioridades.'}
  ];

  var nav=document.getElementById('nav'),steps=document.getElementById('steps'),stepsWrap=document.getElementById('stepsWrap');
  var sceneNum=document.getElementById('sceneNum'),sceneTitle=document.getElementById('sceneTitle'),sceneText=document.getElementById('sceneText');
  var stepNote=document.getElementById('stepNote'),prog=document.getElementById('prog');
  var playBtn=document.getElementById('play');
  var chips=SCENES.map(function(s,i){
    var b=document.createElement('button');b.type='button';b.className='chip';b.textContent=s.name;
    b.addEventListener('click',function(){go(i,true)});nav.appendChild(b);return b;
  });
  var stepLis=CRISP.map(function(c,i){
    var li=document.createElement('li');li.innerHTML='<b>'+(i+1)+'</b><span>'+c[0]+'</span>';steps.appendChild(li);return li;
  });

  /* ---------- cámara ---------- */
  var cur=0,cam=null;
  function camera(){
    var vw=view.clientWidth,vh=view.clientHeight,s=SCENES[cur];
    var k=vw/W*s.z;
    var tx=vw/2-s.focus[0]*k,ty=vh/2-s.focus[1]*k;
    tx=Math.min(0,Math.max(vw-W*k,tx));ty=Math.min(0,Math.max(vh-H*k,ty));
    stage.style.transform='translate('+tx.toFixed(1)+'px,'+ty.toFixed(1)+'px) scale('+k.toFixed(4)+')';
  }
  window.addEventListener('resize',function(){stage.style.transition='none';camera();void stage.offsetWidth;stage.style.transition=''});

  /* ---------- línea de tiempo ---------- */
  var playing=true,elapsed=0,lastT=0,stepIdx=-1;
  function setStep(i){
    stepIdx=i;
    nodeEls.forEach(function(n,j){n.classList.toggle('on',j===i)});
    stepLis.forEach(function(l,j){l.classList.toggle('on',j===i)});
    stepNote.textContent=i>=0?CRISP[i][0]+': '+CRISP[i][1]:'';
  }
  function go(i,manual){
    cur=(i+SCENES.length)%SCENES.length;elapsed=0;
    var s=SCENES[cur];
    app.setAttribute('data-scene',cur);
    chips.forEach(function(c,j){c.setAttribute('aria-current',j===cur?'true':'false')});
    sceneNum.textContent='Escena '+(cur+1)+' de '+SCENES.length;
    sceneTitle.textContent=s.title;sceneText.textContent=s.text;
    stepsWrap.hidden=!s.steps;
    setStep(-1);camera();
  }
  function tick(t){
    if(!lastT)lastT=t;var dt=t-lastT;lastT=t;
    if(playing){
      elapsed+=dt;var s=SCENES[cur];
      prog.style.width=Math.min(100,elapsed/s.dur*100)+'%';
      if(s.steps){
        var lead=1500,per=(s.dur-lead-800)/CRISP.length;
        var i=elapsed<lead?-1:Math.min(CRISP.length-1,Math.floor((elapsed-lead)/per));
        if(i!==stepIdx)setStep(i);
      }
      if(elapsed>=s.dur)go(cur+1);
    }
    requestAnimationFrame(tick);
  }
  function setPlaying(p){
    playing=p;playBtn.textContent=p?'Pausar':'Reproducir';
    app.classList.toggle('paused',!p);
    try{p?fx.unpauseAnimations():fx.pauseAnimations()}catch(e){}
  }
  playBtn.addEventListener('click',function(){setPlaying(!playing)});
  document.getElementById('prev').addEventListener('click',function(){go(cur-1,true)});
  document.getElementById('next').addEventListener('click',function(){go(cur+1,true)});
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight')go(cur+1,true);else if(e.key==='ArrowLeft')go(cur-1,true);
    else if(e.key===' '&&e.target.tagName!=='BUTTON'){e.preventDefault();setPlaying(!playing)}
  });

  stage.style.transition='none';go(0);void stage.offsetWidth;stage.style.transition='';
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce)setPlaying(false);
  window.__go=go;
  requestAnimationFrame(tick);
})();
</script>

</body></html>
